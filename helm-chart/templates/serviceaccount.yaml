{{- /*
Separate ServiceAccounts so that elevated pod security (the evaluator pod's
dind container is privileged) can be granted to the evaluator only, and not to
the web pod or to the namespace's default ServiceAccount.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frx-challenges.web.serviceAccountName" . }}
  labels:
    {{- include "frx-challenges.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "frx-challenges.evaluator.fullname" . }}
  labels:
    {{- include "frx-challenges.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
automountServiceAccountToken: false
