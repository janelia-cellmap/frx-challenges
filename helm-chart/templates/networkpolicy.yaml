{{- if .Values.networkPolicy.enabled }}
# Web pod: only accept connections on the http port, optionally only from the
# peers listed in networkPolicy.web.ingressFrom (e.g. the ingress controller).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frx-challenges.fullname" . }}-web
  labels:
    {{- include "frx-challenges.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frx-challenges.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ include "frx-challenges.nginx.port" . }}
      {{- with .Values.networkPolicy.web.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Evaluator pod (evaluator + dind): accepts no inbound connections at all.
# Outbound is limited to networkPolicy.evaluator.egress. Containers started by
# dind use this pod's network namespace for egress, so they are covered too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frx-challenges.evaluator.fullname" . }}
  labels:
    {{- include "frx-challenges.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frx-challenges.evaluator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.evaluator.egress | nindent 4 }}
{{- end }}
